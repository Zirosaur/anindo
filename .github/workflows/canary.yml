name: Canary Scraper Health Check

on:
  schedule:
    # Run everyday at 23:00 UTC (06:00 WIB)
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  canary-check:
    name: Test Scraper Pipeline & Stream Resolvers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y curl

      - name: Install Python Dependencies
        run: |
          pip install cryptography

      - name: Run Canary Health Check
        run: |
          python3 tests/canary_test.py
